[package]
name = "bun-engine"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Minimal modular Rust game-engine kernel with opt-in Bevy, wgpu and winit layers"
repository = "https://github.com/aphrody-labs/bun-engine"

[features]
default = []
ecs = ["dep:bevy_app", "dep:bevy_ecs"]
render = ["dep:wgpu", "dep:winit"]
editor = ["ecs", "render"]

[dependencies]
bevy_app = { git = "https://github.com/aphrody-labs/bevy.git", rev = "c8d199b192a1b173746f7a160d259c4db8ab7789", optional = true }
bevy_ecs = { git = "https://github.com/aphrody-labs/bevy.git", rev = "c8d199b192a1b173746f7a160d259c4db8ab7789", optional = true }
wgpu = { git = "https://github.com/aphrody-labs/wgpu.git", rev = "60036cdc0ad979c96ec8277df41ec35b098502f6", optional = true }
winit = { git = "https://github.com/aphrody-labs/winit.git", rev = "f0a83481c233c714d061356305f89bace0106f39", optional = true }

[[bin]]
name = "bun-engine-editor"
path = "src/bin/editor.rs"
required-features = ["editor"]
