[workspace]
resolver = "3"
members = [
  "crates/bun-engine-core",
  "crates/nds",
  "crates/ghidra-decompiler",
  "crates/aphrody-aarch64",
  "crates/aphrody-switch",
  "crates/aphrody-wii",
  "crates/aphrody-wii-image",
  "crates/android-native",
  "crates/repo-manage-util",
  "crates/ctru-rs/ctru-rs",
  "crates/ctru-rs/ctru-sys",
  "crates/ctru-rs/test-runner",
]
exclude = [
  "crates/bevy",
  "crates/wgpu",
  "crates/winit",
  "crates/dust",
  "crates/jgenesis",
  "crates/rustboyadvance-ng",
  "crates/starpsx",
  "crates/tetanes",
  "crates/zakuro",
  "crates/magika",
]
default-members = ["crates/bun-engine-core"]

[workspace.package]
edition = "2024"
repository = "https://github.com/aphrody-labs/bun-engine"

[workspace.lints.rust]
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.dependencies]
bevy_app = { path = "crates/bevy/crates/bevy_app" }
bevy_ecs = { path = "crates/bevy/crates/bevy_ecs" }
wgpu = { path = "crates/wgpu/wgpu", default-features = false, features = [
  "dx12",
  "static-dxc",
  "wgsl",
  "spirv",
  "glsl",
] }
winit = { path = "crates/winit/winit", default-features = false }
tracing = "0.1"
ghidra-decompiler = { path = "crates/ghidra-decompiler" }
zerocopy = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
libc = { version = "0.2.153", default-features = false }
shim-3ds = { git = "https://github.com/rust3ds/shim-3ds.git" }
pthread-3ds = { git = "https://github.com/rust3ds/pthread-3ds.git" }
test-runner = { path = "crates/ctru-rs/test-runner" }

[patch.'https://github.com/rust3ds/ctru-rs.git']
test-runner = { path = "crates/ctru-rs/test-runner" }
ctru-rs = { path = "crates/ctru-rs/ctru-rs" }
ctru-sys = { path = "crates/ctru-rs/ctru-sys" }

[patch."https://github.com/rust3ds/test-runner.git"]
test-runner = { path = "crates/ctru-rs/test-runner" }
