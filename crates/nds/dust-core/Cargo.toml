[package]
name = "aphrody-dust-core"
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
autotests = false

[features]
default = []
log = ["dep:slog"]
bft-r = []
bft-w = []
jit = ["bft-w"]
pu-checks = []
interp-timing-details = []
interp-pipeline = []
interp-pipeline-accurate-reloads = ["interp-pipeline"]
interp-arm9-interlocks = ["interp-pipeline"]
interp-r15-write-checks = []
3d-hi-res-coords = []
disasm = []
serde = ["dep:serde"]
xq-audio = []
channel-audio-capture = []
debugger-hooks = ["bft-r", "bft-w"]
nds-rom = [
  "dep:bitfield-struct",
  "dep:bitreader",
  "dep:bytemuck",
  "dep:crc",
  "dep:derive_more",
  "dep:encoding_rs",
  "dep:image",
  "dep:log",
  "dep:rust-bitwriter",
  "dep:serde",
  "dep:serde-saphyr",
  "dep:sha1",
  "dep:snafu",
]
nds-decomp = ["nds-rom", "dep:unarm", "dep:strum", "dep:strum_macros"]
nds-complete = ["nds-rom", "nds-decomp"]

[dependencies]
aphrody-emu-utils = { path = "../emu-utils" }
bitflags = "2.9"
cfg-if = "1"
proc-bitfield = "0.5"
slog = { version = "2.7", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
bitfield-struct = { version = "0.12", optional = true }
bitreader = { version = "0.3", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
crc = { version = "3.4", optional = true }
derive_more = { version = "2.1", features = ["display"], optional = true }
encoding_rs = { version = "0.8", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
log = { version = "0.4", optional = true }
rust-bitwriter = { version = "0.0", optional = true }
serde-saphyr = { version = "0.0", optional = true }
sha1 = { version = "0.10", optional = true }
snafu = { version = "0.8", features = ["backtrace"], optional = true }
strum = { version = "0.28", default-features = false, features = ["derive"], optional = true }
strum_macros = { version = "0.28", optional = true }
unarm = { version = "2.2", default-features = false, features = ["arm", "thumb", "v5te"], optional = true }

[build-dependencies]
arm-decoder = { git = "https://github.com/kelpsyberry/arm-decoder" }
